<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaito Review - Audio & Truyện</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0f19; --primary: #8b5cf6; --primary-hover: #7c3aed;
            --text-main: #f8fafc; --text-sub: #94a3b8; --border-glass: rgba(255,255,255,0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Be Vietnam Pro', sans-serif; }
        
        body {
            background: linear-gradient(180deg, rgba(11, 15, 25, 0.9) 0%, rgba(15, 23, 42, 0.96) 100%),
                        url('https://images.unsplash.com/photo-1578632767115-351597cf2477?w=2000') center/cover fixed;
            color: var(--text-main); padding-bottom: 70px;
        }

        /* HEADER */
        header { background: rgba(11,15,25,0.85); backdrop-filter: blur(15px); padding: 15px 20px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-glass); }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: bold; color: #fff; text-decoration: none; }
        .logo span { color: var(--primary); }
        
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-btn { background: none; border: none; color: var(--text-sub); font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { color: #fff; }
        
        .btn-auth { background: var(--primary); color: #fff; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-auth:hover { background: var(--primary-hover); }

        /* HERO & SEARCH */
        .hero { max-width: 800px; margin: 30px auto; text-align: center; padding: 0 20px; }
        .visit-badge { display: inline-block; background: rgba(139,92,246,0.2); border: 1px solid var(--primary); padding: 5px 15px; border-radius: 20px; font-size: 13px; color: #38bdf8; margin-bottom: 20px; font-weight: bold;}
        .banner-img { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        
        .search-box { width: 100%; padding: 15px 20px; border-radius: 30px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.5); color: #fff; font-size: 15px; margin-bottom: 20px; outline: none; }
        .search-box:focus { border-color: var(--primary); }

        .category-pills { display: flex; justify-content: center; gap: 15px; }
        .pill { padding: 10px 30px; border-radius: 25px; border: 1px solid var(--border-glass); background: rgba(255,255,255,0.05); color: var(--text-sub); font-weight: bold; cursor: pointer; transition: 0.3s; }
        .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* GRID CONTENT */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .card { background: rgba(15,23,42,0.8); border: 1px solid var(--border-glass); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .card-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 15px; }
        .btn-play { background: var(--border-glass); text-align: center; padding: 10px; border-radius: 8px; color: #fff; text-decoration: none; font-weight: bold; margin-top: auto; transition: 0.3s; cursor:pointer;}
        .btn-play:hover { background: var(--primary); }

        /* MODALS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000; padding: 20px; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: rgba(15,23,42,0.95); border: 1px solid var(--border-glass); border-radius: 15px; width: 100%; max-width: 400px; padding: 30px; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sub); cursor: pointer; }
        .modal-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.5); color: #fff; margin-bottom: 15px;}
        .modal-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; }

        .auth-tabs { display: flex; border-bottom: 1px solid var(--border-glass); margin-bottom: 20px; }
        .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: var(--text-sub); }
        .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        /* TRANG CÁ NHÂN */
        .profile-menu { margin-top: 20px; }
        .profile-btn { width: 100%; text-align: left; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: #fff; font-weight: bold; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .profile-btn:hover { background: rgba(255,255,255,0.1); }
        .profile-btn.danger { color: #ef4444; }

        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #10b981; color: #fff; padding: 10px 20px; border-radius: 20px; font-weight: bold; opacity: 0; transition: 0.3s; z-index: 2000;}
        .toast.error { background: #ef4444; }
        .toast.show { opacity: 1; }

        @media (max-width: 768px) { .nav-links { display: none; } }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo">Kaito <span>Review</span></a>
            <div class="nav-links">
                <button class="nav-btn active" onclick="filterData('Truyện')">Truyện</button>
                <button class="nav-btn" onclick="filterData('Nghe Audio')">Nghe Audio</button>
                <button class="btn-auth" id="header-user-btn" onclick="openAuth()">Đăng Nhập</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="visit-badge">⚡ Lượt truy cập web: <span id="visit-count">...</span></div>
        <img src="https://i.postimg.cc/T1tyZL0t/1FAB0943-6555-42CB-8034-1CFC44E8C379.png" class="banner-img">
        
        <input type="text" class="search-box" id="searchBox" placeholder="🔍 Tìm kiếm truyện, audio..." oninput="handleSearch()">
        
        <div class="category-pills">
            <button class="pill active" id="btn-cat-truyen" onclick="filterData('Truyện')">📖 Truyện Tranh</button>
            <button class="pill" id="btn-cat-audio" onclick="filterData('Nghe Audio')">🎧 Nghe Audio</button>
        </div>
    </section>

    <main class="main-container">
        <h2 style="margin-bottom: 20px; font-size: 20px;" id="sec-title">Danh Mục: Truyện Tranh</h2>
        <div class="grid" id="data-grid">
            <div style="text-align: center; color: var(--text-sub); grid-column: 1/-1;">Đang tải dữ liệu...</div>
        </div>
    </main>

    <!-- MODAL AUTH -->
    <div class="modal" id="modal-auth">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('modal-auth')">✕</button>
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Đăng Nhập</div>
                <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Đăng Ký</div>
            </div>
            
            <input type="text" id="auth-user" class="modal-input" placeholder="Tên tài khoản">
            <input type="password" id="auth-pass" class="modal-input" placeholder="Mật khẩu">
            
            <div class="input-group" id="save-login-group">
                <label><input type="checkbox" id="save-login" checked> Lưu thông tin đăng nhập</label>
            </div>

            <button class="modal-btn" id="btn-submit-auth" onclick="submitAuth()">Đăng Nhập</button>
        </div>
    </div>

    <!-- TRANG CÁ NHÂN -->
    <div class="modal" id="modal-profile">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('modal-profile')">✕</button>
            <h2 style="text-align: center; margin-bottom: 5px;">Trang Cá Nhân</h2>
            <p style="text-align: center; color: var(--primary); font-weight: bold; margin-bottom: 20px;">@<span id="profile-name"></span></p>
            
            <div class="profile-menu">
                <button class="profile-btn" onclick="showHistory()">🕒 Xem lịch sử đang theo dõi</button>
                <button class="profile-btn" onclick="openChangePass()">🔑 Đổi mật khẩu</button>
                <button class="profile-btn danger" onclick="logout()">🚪 Đăng xuất tài khoản</button>
            </div>
        </div>
    </div>

    <!-- MODAL ĐỔI MẬT KHẨU -->
    <div class="modal" id="modal-pass">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('modal-pass')">✕</button>
            <h2 style="margin-bottom: 20px;">Đổi Mật Khẩu</h2>
            <input type="password" id="old-pass" class="modal-input" placeholder="Mật khẩu hiện tại">
            <input type="password" id="new-pass" class="modal-input" placeholder="Mật khẩu mới">
            <button class="modal-btn" onclick="submitChangePass()">Xác Nhận Đổi</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzuU0M9xSDUtqtu-Hzx9SHhfFTMtWTsOKH7ewkBhgh-pG_Gs4tZyXJhm1tdhLPrmLdE/exec';
        
        let allData = [];
        let currentCat = 'Truyện';
        let searchQuery = '';
        let currentUser = localStorage.getItem('kaito_saved_user'); // Tự động lấy user đã lưu
        let authMode = 'login';

        document.addEventListener('DOMContentLoaded', () => {
            updateUserUI();
            checkVisitCount();
        });

        // 1. KIỂM TRA LƯỢT TRUY CẬP MỚI
        async function checkVisitCount() {
            // Kiểm tra session xem người này mới vào hay F5
            let isNewVisit = !sessionStorage.getItem('visited');
            if(isNewVisit) sessionStorage.setItem('visited', 'true');

            try {
                const res = await fetch(`${API_URL}?new_visit=${isNewVisit}`);
                const data = await res.json();
                
                document.getElementById('visit-count').innerText = data.totalVisits;
                allData = data.videos || [];
                renderGrid();
            } catch(e) {
                console.error("Lỗi mạng");
            }
        }

        // 2. HIỂN THỊ DỮ LIỆU & TÌM KIẾM
        function renderGrid(customList = null) {
            const grid = document.getElementById('data-grid');
            let list = customList || allData.filter(v => (v.category || '').toLowerCase().includes(currentCat.toLowerCase()));

            if (searchQuery) {
                list = list.filter(v => v.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            if (list.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color: var(--text-sub);">Không có dữ liệu!</div>`;
                return;
            }

            grid.innerHTML = list.map(v => `
                <div class="card">
                    <img class="card-img" src="${v.thumbnail}" onerror="this.src='https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800'">
                    <div class="card-body">
                        <div class="card-title">${v.title}</div>
                        <div class="card-desc">${v.desc || ''}</div>
                        <a href="${v.videoUrl}" target="_blank" class="btn-play" onclick="saveHistory(${v.id})">${v.buttonText || 'Xem Ngay'}</a>
                    </div>
                </div>
            `).join('');
        }

        function filterData(cat) {
            currentCat = cat;
            document.getElementById('btn-cat-truyen').classList.toggle('active', cat === 'Truyện');
            document.getElementById('btn-cat-audio').classList.toggle('active', cat === 'Nghe Audio');
            document.getElementById('sec-title').innerText = `Danh Mục: ${cat}`;
            renderGrid();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchBox').value.trim();
            renderGrid();
        }

        // 3. HỆ THỐNG TÀI KHOẢN
        function updateUserUI() {
            const btn = document.getElementById('header-user-btn');
            if (currentUser) {
                btn.innerText = `👤 ${currentUser}`;
                btn.onclick = () => document.getElementById('modal-profile').classList.add('active');
            } else {
                btn.innerText = 'Đăng Nhập';
                btn.onclick = openAuth;
            }
        }

        function openAuth() { document.getElementById('modal-auth').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function switchTab(mode) {
            authMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('save-login-group').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('btn-submit-auth').innerText = mode === 'login' ? 'Đăng Nhập' : 'Đăng Ký';
        }

        async function submitAuth() {
            const user = document.getElementById('auth-user').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            const save = document.getElementById('save-login').checked;

            if(!user || !pass) return showToast('Nhập đủ thông tin!', true);

            document.getElementById('btn-submit-auth').innerText = 'Đang xử lý...';
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: authMode, username: user, password: pass })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    if (save) localStorage.setItem('kaito_saved_user', user);
                    currentUser = user;
                    updateUserUI();
                    closeModal('modal-auth');
                    showToast(authMode === 'login' ? 'Đăng nhập thành công!' : 'Tạo tài khoản thành công!');
                } else {
                    showToast(data.message, true);
                }
            } catch(e) {
                showToast('Lỗi mạng!', true);
            }
            document.getElementById('btn-submit-auth').innerText = authMode === 'login' ? 'Đăng Nhập' : 'Đăng Ký';
        }

        function logout() {
            localStorage.removeItem('kaito_saved_user');
            currentUser = null;
            updateUserUI();
            closeModal('modal-profile');
            showToast('Đã đăng xuất!');
            renderGrid(); // Reset lại bảng
        }

        function openChangePass() {
            closeModal('modal-profile');
            document.getElementById('modal-pass').classList.add('active');
        }

        async function submitChangePass() {
            const oldP = document.getElementById('old-pass').value;
            const newP = document.getElementById('new-pass').value;
            if(!oldP || !newP) return showToast('Nhập đủ thông tin!', true);

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'change_password', username: currentUser, old_password: oldP, new_password: newP })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    showToast('Đổi mật khẩu thành công!');
                    closeModal('modal-pass');
                } else {
                    showToast(data.message, true);
                }
            } catch(e) { showToast('Lỗi!', true); }
        }

        function saveHistory(id) {
            if(!currentUser) return;
            let hist = JSON.parse(localStorage.getItem(`hist_${currentUser}`) || '[]');
            if(!hist.includes(id)) hist.unshift(id);
            localStorage.setItem(`hist_${currentUser}`, JSON.stringify(hist));
        }

        function showHistory() {
            closeModal('modal-profile');
            if(!currentUser) return;
            let hist = JSON.parse(localStorage.getItem(`hist_${currentUser}`) || '[]');
            let list = hist.map(id => allData.find(v => v.id == id)).filter(Boolean);
            document.getElementById('sec-title').innerText = `🕒 Lịch Sử Của ${currentUser}`;
            renderGrid(list);
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = isError ? 'toast error show' : 'toast show';
            setTimeout(() => t.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
